name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/cache@v6
        with:
          path: ~/.cache/permdiff
          key: permdiff-opa-${{ runner.os }}-${{ runner.arch }}-1.21.0
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=permdiff --cov-fail-under=80
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: uv run pytest -m slow -o addopts="" tests/slow
      - if: matrix.python == '3.12'
        name: Cedar extra
        run: |
          uv sync --extra cedar --dev
          uv run pytest -o addopts="" tests/unit/evaluators/cedar tests/integration/test_demo_cedar.py
          uv run pytest -m slow -o addopts="" tests/slow/test_cedar_100k.py
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/permdiff
          key: permdiff-opa-${{ runner.os }}-${{ runner.arch }}-1.21.0
      - run: scripts/quickstart_check.sh
